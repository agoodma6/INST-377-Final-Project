<html>
<head>
    <title>Historic UMD Weather Planner</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1>Historic UMD Weather Planner</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="saved.html">Saved Days</a>
        <a href="help.html">Help</a>
    </nav>

    <main>
        <h2>Search UMD Weather History</h2>

        <form id="weatherForm">
            <label>Latitude:</label>
            <input type="text" id="latitude" value="38.98" required>

            <br><br>

            <label>Longitude:</label>
            <input type="text" id="longitude" value="-76.94" required>

            <br><br>

            <label>Date:</label>
            <input type="date" id="date" required>

            <br><br>

            <button type="submit">Search Weather</button>
        </form>

        <h2 id="weatherResult"></h2>

        <button id="saveButton">Save Weather Day</button>

        <canvas id="weatherChart"></canvas>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
